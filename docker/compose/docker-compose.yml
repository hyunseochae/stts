name: stts

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: docker/image/api-gateway/Dockerfile
    image: stts-api-gateway:latest
    container_name: stts-api-gateway
    ports:
      - "8000:8000"
    environment:
      - STT_SERVICE_URL=http://stts-stt-service:8001
      - LLM_SERVICE_URL=http://stts-llm-service:8002
      - TTS_SERVICE_URL=http://stts-tts-service:8003
    depends_on:
      - stt-service
      - llm-service
      - tts-service
    networks:
      - stts-net
    restart: unless-stopped

  stt-service:
    build:
      context: ../..
      dockerfile: docker/image/stt-service/Dockerfile
    image: stts-stt-service:latest
    container_name: stts-stt-service
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL_SIZE=base
      - CUDA_VISIBLE_DEVICES=""
    networks:
      - stts-net
    restart: unless-stopped

  llm-service:
    build:
      context: ../..
      dockerfile: docker/image/llm-service/Dockerfile
    image: stts-llm-service:latest
    container_name: stts-llm-service
    ports:
      - "8002:8002"
    environment:
      - VLLM_URL=http://172.17.0.1:11434/v1
      - VLLM_MODEL=openai/gpt-oss-20b
    networks:
      - stts-net
    restart: unless-stopped

  tts-service:
    build:
      context: ../..
      dockerfile: docker/image/tts-service/Dockerfile
    image: stts-tts-service:latest
    container_name: stts-tts-service
    ports:
      - "8003:8003"
    environment:
      - REF_VOICE_DIR=/app/ref_voices
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ../../src/tts-service/ref_voices:/app/ref_voices
    networks:
      - stts-net
    restart: unless-stopped

networks:
  stts-net:
    driver: bridge
